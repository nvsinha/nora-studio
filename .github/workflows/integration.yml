---
# Integration tests exercise real agent networks against real LLM providers,
# so they cost money and need keys. Manual dispatch plus a nightly schedule,
# never on push.
#
# If OPENAI_API_KEY is not configured, the job skips cleanly rather than
# failing -- an unconfigured integration suite should not read as a broken
# build.
#
# This also covers what used to be a separate agent_network_designer workflow:
# it is the same shape of test with the same requirements.

name: Integration

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Daily at 04:00 UTC
    - cron: '0 4 * * *'

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      # v6.0.2
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Check for required secrets
        id: guard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not configured -- skipping integration tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # v7.0.0
      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'

      # Remove once the Nora repos are public.
      - name: Authenticate for private Nora dependencies
        if: steps.guard.outputs.run == 'true'
        env:
          NORA_REPOS_TOKEN: ${{ secrets.NORA_REPOS_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${NORA_REPOS_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Run integration tests
        if: steps.guard.outputs.run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .
          AGENT_TOOL_PATH: coded_tools/
          AGENT_MANIFEST_FILE: registries/manifest.hocon
        run: pytest -s -m "integration" --timer-top-n 100
