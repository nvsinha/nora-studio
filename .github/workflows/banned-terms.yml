---
# Provenance guard.
#
# This repository was migrated away from a prior owner. This workflow makes
# that migration stick: it fails if a banned term reappears anywhere in the
# working tree or in any git object reachable from any ref.
#
# fetch-depth: 0 is required -- the scan covers history, not just HEAD.

name: Banned terms

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  scan:
    name: Scan working tree and git history
    runs-on: ubuntu-latest

    steps:
      # v6.0.2
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Scan
        run: python build_scripts/check_banned_terms.py
